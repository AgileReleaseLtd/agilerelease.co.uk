<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" width="560" height="500">
  <defs>
    <!-- Hand-cut felt: a gentle wobble on every edge, then a fine grain on the shapes only. -->
    <filter id="felt" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="4" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="5" xChannelSelector="R" yChannelSelector="G" result="cut"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.15  0 0 0 0 0.22  0.42 0 0 0 -0.16" result="specks"/>
      <feComposite in="specks" in2="cut" operator="in" result="specksIn"/>
      <feMerge><feMergeNode in="cut"/><feMergeNode in="specksIn"/></feMerge>
    </filter>
    <clipPath id="roof"><path d="M128 218 L266 104 L402 218 Z"/></clipPath>
  </defs>

  <g filter="url(#felt)">
    <!-- sun -->
    <circle cx="468" cy="92" r="54" fill="#f4bf55"/>
